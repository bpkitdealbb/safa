<script>
// ===PURE-START===
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function emptyAgg() { return { pktG: 0, pktCost: 0, bulkG: 0, bulkCost: 0, bulkRev: 0, eatG: 0, eatCost: 0, exp: 0 }; }

// লেনদেনের লগ থেকে সব হিসাব বের করে (মুভিং ওয়েটেড এভারেজ)
function compute(txs, batches) {
    const sorted = txs.slice().sort((a, b) => (a.ts - b.ts) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const items = {}, order = [], costOf = {}, byRef = {}, blendOutCost = {};
    const negatives = [];
    const standalone = emptyAgg();
    let expTotal = 0;

    function get(n) {
        if (!items[n]) {
            order.push(n);
            items[n] = { name: n, idx: order.length - 1, stock: 0, value: 0, lastAvg: 0,
                boughtG: 0, boughtCost: 0, pktG: 0, pktCost: 0, bulkG: 0, bulkCost: 0, bulkRev: 0,
                eatG: 0, eatCost: 0, blendG: 0, blendCost: 0, madeG: 0, madeCost: 0, adjG: 0,
                minP: null, maxP: null, lastBuy: null, buys: [], isMixed: false };
        }
        return items[n];
    }

    sorted.forEach(t => {
        if (t.type === 'EXPENSE') {
            const a = num(t.amountTk);
            expTotal += a; costOf[t.id] = a;
            const rf = t.ref || '';
            if (rf.indexOf('b_') === 0) { (byRef[rf] || (byRef[rf] = emptyAgg())).exp += a; }
            else if (rf === '') standalone.exp += a;
            return;
        }
        const it = get(t.item);
        const g = num(t.grams);
        if (t.type === 'OPENING' || t.type === 'RESTOCK') {
            const p = num(t.pricePerKg), c = g / 1000 * p;
            it.stock += g; it.value += c; it.boughtG += g; it.boughtCost += c;
            it.lastBuy = p;
            it.minP = it.minP === null ? p : Math.min(it.minP, p);
            it.maxP = it.maxP === null ? p : Math.max(it.maxP, p);
            if (it.stock > 1e-9) it.lastAvg = it.value / it.stock * 1000;
            it.buys.push({ id: t.id, date: t.date, ts: t.ts, type: t.type, g, price: p, cost: c, avgAfter: it.lastAvg });
            costOf[t.id] = c;
        } else if (t.type === 'ADJUST_IN') {
            const c = it.stock > 1e-9 ? g * it.value / it.stock : g / 1000 * it.lastAvg;
            it.stock += g; it.value += c; it.adjG += g;
            if (it.stock > 1e-9) it.lastAvg = it.value / it.stock * 1000;
            costOf[t.id] = c;
        } else if (t.type === 'BLEND_IN') {
            const c = (t.ref && blendOutCost[t.ref] !== undefined) ? blendOutCost[t.ref] : num(t.amountTk);
            it.stock += g; it.value += c; it.madeG += g; it.madeCost += c; it.isMixed = true; if (g > 0) it.lastBuy = c / g * 1000;
            if (it.stock > 1e-9) it.lastAvg = it.value / it.stock * 1000;
            costOf[t.id] = c;
        } else {
            let c;
            if (it.stock > 1e-9) c = g * it.value / it.stock; else c = g / 1000 * it.lastAvg;
            if (g > it.stock + 1e-6) negatives.push({ item: t.item, tx: t.id });
            it.stock -= g; it.value -= c;
            if (Math.abs(it.stock) < 1e-6) { it.stock = 0; it.value = 0; }
            if (it.value < 0) it.value = 0;
            costOf[t.id] = c;
            const ref = t.ref || '';
            let agg = null;
            if (ref.indexOf('b_') === 0) { agg = byRef[ref] || (byRef[ref] = emptyAgg()); }
            else if (ref === '') { agg = standalone; }
            if (t.type === 'PACKET') { it.pktG += g; it.pktCost += c; if (agg) { agg.pktG += g; agg.pktCost += c; } }
            else if (t.type === 'BULK') { const r = num(t.amountTk); it.bulkG += g; it.bulkCost += c; it.bulkRev += r; if (agg) { agg.bulkG += g; agg.bulkCost += c; agg.bulkRev += r; } }
            else if (t.type === 'EAT') { it.eatG += g; it.eatCost += c; if (agg) { agg.eatG += g; agg.eatCost += c; } }
            else if (t.type === 'BLEND_OUT') { it.blendG += g; it.blendCost += c; blendOutCost[t.ref] = (blendOutCost[t.ref] || 0) + c; }
        }
    });

    const list = order.map(n => {
        const it = items[n];
        it.avg = it.stock > 1e-9 ? it.value / it.stock * 1000 : it.lastAvg;
        it.lifeAvgBuy = it.boughtG > 0 ? it.boughtCost / it.boughtG * 1000 : (it.madeG > 0 ? it.madeCost / it.madeG * 1000 : 0);
        it.repl = it.lastBuy === null ? it.avg : it.lastBuy;
        it.usedG = it.pktG + it.bulkG + it.eatG + it.blendG;
        it.usedCost = it.pktCost + it.bulkCost + it.eatCost + it.blendCost;
        return it;
    });

    const bres = batches.slice().sort((a, b) => a.ts - b.ts).map(b => {
        const a = byRef[b.id] || emptyAgg();
        const packets = num(b.packets), pkg = num(b.packagingCost), sell = num(b.sellingPrice);
        const totalPacketCost = a.pktCost + pkg;
        const costPerPacket = totalPacketCost / (packets > 0 ? packets : 1);
        const sold = (b.soldPackets === undefined || b.soldPackets === null || b.soldPackets === '') ? packets : num(b.soldPackets);
        const packetRevenue = sold * sell;
        const packetProfit = packetRevenue - totalPacketCost;
        const bulkProfit = a.bulkRev - a.bulkCost;
        const net = packetProfit + bulkProfit - a.eatCost - a.exp;
        const margin = costPerPacket > 0 ? (sell - costPerPacket) / costPerPacket * 100 : 0;
        return Object.assign({}, b, a, { packets, packagingCost: pkg, sellingPrice: sell, soldPackets: sold, otherCost: a.exp,
            totalPacketCost, costPerPacket, packetRevenue, packetProfit, bulkProfit, net, margin });
    });

    const T = { stockValue: 0, boughtCost: 0, boughtG: 0, pktCost: 0, bulkCost: 0, bulkRev: 0, eatCost: 0, eatG: 0,
        packaging: 0, packetRevenue: 0, packets: 0, profit: 0, expense: 0, adjG: 0 };
    list.forEach(it => {
        T.stockValue += it.value; T.boughtCost += it.boughtCost; T.boughtG += it.boughtG;
        T.pktCost += it.pktCost; T.bulkCost += it.bulkCost; T.bulkRev += it.bulkRev;
        T.eatCost += it.eatCost; T.eatG += it.eatG; T.adjG += it.adjG;
    });
    bres.forEach(b => { T.packaging += b.packagingCost; T.packetRevenue += b.packetRevenue; T.packets += b.packets; });
    T.expense = expTotal;
    T.profit = T.packetRevenue + T.bulkRev - T.pktCost - T.bulkCost - T.packaging - T.eatCost - T.expense;

    return { items: list, map: items, batches: bres, byRef, standalone, costOf, totals: T, negatives };
}

// এই মুহূর্তের গড় দামে g গ্রামের খরচ
function costNow(it, g) {
    if (!it) return 0;
    g = num(g);
    return it.stock > 1e-9 ? g * it.value / it.stock : g / 1000 * it.lastAvg;
}

// ব্যাচ ও আইটেমভিত্তিক লাভ-বণ্টন।
// প্যাকেট আইটেম আলাদা করে বিক্রি হয় না, তাই বিক্রয় মূল্য ও প্যাকেজিং খরচ আইটেমগুলোর মধ্যে ভাগ করা হয়:
//   alloc='cost'   -> আইটেমের খরচের অনুপাতে (সব আইটেমের মার্জিন সমান)
//   alloc='weight' -> আইটেমের ওজনের অনুপাতে
//   alloc='price'  -> আইটেমের বিক্রয় মূল্য/কেজি × গ্রামের অনুপাতে (দাম না থাকলে গড় কেনা দর)
// বাল্ক বিক্রি ও খাওয়া/ঘাটতি আইটেম-নির্দিষ্ট, তাই সরাসরি যায়। অন্যান্য খরচ (ডেলিভারি/বিজ্ঞাপন ইত্যাদি) আলাদা সারিতে।
function itemProfit(txs, st, alloc, prices, rawBatches) {
    const byB = {}, items = {}, itemBatches = {}, per = {};
    txs.forEach(t => {
        if (t.type !== 'PACKET' || !t.ref || t.ref.indexOf('b_') !== 0) return;
        const bb = byB[t.ref] || (byB[t.ref] = {});
        const r = bb[t.item] || (bb[t.item] = { g: 0, c: 0 });
        r.g += num(t.grams); r.c += st.costOf[t.id] || 0;
    });
    const gi = n => items[n] || (items[n] = { name: n, pkt: 0, bulk: 0, eat: 0, net: 0, batchCost: 0, pktAll: 0 });
    st.items.forEach(it => { const x = gi(it.name); x.bulk = it.bulkRev - it.bulkCost; x.eat = it.eatCost; x.pktAll = it.pktCost; });
    let unalloc = 0;
    st.batches.forEach(b => {
        const bb = byB[b.id] || {}, names = Object.keys(bb);
        const P = b.packets > 0 ? b.packets : 1, S = b.soldPackets, sell = b.sellingPrice, pkg = b.packagingCost;
        const raw = (rawBatches || []).find(x => x.id === b.id) || {}, sp = raw.sp || {};
        const priceOf = n => { const v = sp[n] !== undefined ? sp[n] : (prices || {})[n]; return v > 0 ? v : 0; };
        if (!names.length) { unalloc += S * sell - pkg; per[b.id] = { rows: [], P, S, sell, pkg }; return; }
        let sumC = 0, sumG = 0, sumV = 0; const val = {};
        names.forEach(n => { sumC += bb[n].c; sumG += bb[n].g; val[n] = bb[n].g / 1000 * (priceOf(n) || (bb[n].g > 0 ? bb[n].c / bb[n].g * 1000 : 0)); sumV += val[n]; });
        const rows = names.map(n => {
            const r = bb[n];
            const share = alloc === 'weight' ? (sumG > 0 ? r.g / sumG : 1 / names.length)
                : alloc === 'price' ? (sumV > 0 ? val[n] / sumV : 1 / names.length)
                : (sumC > 0 ? r.c / sumC : 1 / names.length);
            const rev = S * sell * share, pk = pkg * share;
            return { item: n, share, g: r.g, c: r.c, gPer: r.g / P, cPer: r.c / P, priceKg: r.g > 0 ? r.c / r.g * 1000 : 0,
                revPer: sell * share, pkgPer: pk / P, profitPer: sell * share - r.c / P - pk / P, rev, pk, profit: rev - r.c - pk };
        });
        per[b.id] = { rows, P, S, sell, pkg };
        rows.forEach(r => {
            const x = gi(r.item); x.pkt += r.profit; x.batchCost += r.c;
            (itemBatches[r.item] || (itemBatches[r.item] = [])).push({ id: b.id, date: b.date, g: r.g, c: r.c, rev: r.rev + 0, pk: r.pk, profit: r.profit });
        });
    });
    const list = Object.keys(items).map(n => {
        const x = items[n];
        const loose = Math.max(0, x.pktAll - x.batchCost);   // ব্যাচ ছাড়া প্যাকেটে গেছে (আয় নেই)
        x.pkt -= loose; x.loose = loose;
        x.net = x.pkt + x.bulk - x.eat;
        return x;
    }).filter(x => Math.abs(x.pkt) + Math.abs(x.bulk) + Math.abs(x.eat) > 1e-9);
    list.sort((a, b) => b.net - a.net);
    const sumItems = list.reduce((s, x) => s + x.net, 0);
    const expense = st.totals.expense;
    return { per, items: list, itemBatches, unalloc, sumItems, expense, finalNet: sumItems + unalloc - expense };
}
// ===PURE-END===

// ---------- সেটআপ ও ডাটা ----------
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyC2bmAtHLQNt1nobq8y-yyDaYAsNWIEKgc",
    authDomain: "demomixfood.firebaseapp.com",
    projectId: "demomixfood",
    storageBucket: "demomixfood.firebasestorage.app",
    messagingSenderId: "905891531269",
    appId: "1:905891531269:web:fe640a761c23f7377aea6c"
};   // Firebase ওয়েব কনফিগ গোপন নয়; ডাটা সুরক্ষিত থাকে Firestore সিকিউরিটি রুলস দিয়ে
const DEMO = /[?&]demo=1\b/.test(location.search);   // ?demo=1 দিলে ডেমো মোড: লগইন ছাড়া, আলাদা স্টোরেজ, নমুনা ডাটা
let LS_KEY = DEMO ? 'safabox_demo_ledger_v2' : 'safabox_cloud_v3_anon';
let LS_DRAFT = DEMO ? 'safabox_demo_draft_v2' : 'safabox_cloud_draft_v3_anon';
const LEGACY_KEY = 'safabox_ledger_v2';   // পুরোনো (Apps Script) সংস্করণের লোকাল ডাটা
let cloudUser = null;
const ADMIN_EMAIL = 'bpsujon0842@gmail.com';   // শুধু এই Gmail অ্যাডমিন; আসল নিয়ন্ত্রণ Firestore রুলসে
const SUPPORT_WHATSAPP = '8801614962727';      // মেয়াদ শেষের ব্যানারে WhatsApp যোগাযোগ (আন্তর্জাতিক ফরম্যাটে নম্বর)
const TRIAL_DAYS = 7;
let acc = { known: false, ok: true, plan: '', untilMs: 0 };

const DEFAULT_ITEMS = [
    ['কাঠবাদাম', 1320], ['কাজুবাদাম', 1380], ['আখরোট', 1000], ['চীনাবাদাম', 320], ['কিসমিস', 870],
    ['কুমড়ো বীজ', 800], ['সূর্যমুখী বীজ', 250], ['সাদা তিল', 235], ['খুরমা', 240], ['কালো জিরা', 500]
];
const TYPE_LABEL = { OPENING: 'শুরুর স্টক', RESTOCK: 'রিস্টক', PACKET: 'প্যাকেট', BULK: 'বাল্ক বিক্রি', EAT: 'খাওয়া/ঘাটতি', BLEND_OUT: 'ব্লেন্ডে ব্যবহার', BLEND_IN: 'ব্লেন্ড তৈরি', ADJUST_IN: 'ওজন সংশোধন (বেশি)', EXPENSE: 'অন্যান্য খরচ' };
const TYPE_COLOR = { OPENING: 'bg-sky-100 text-sky-800', RESTOCK: 'bg-sky-100 text-sky-800', PACKET: 'bg-emerald-100 text-emerald-800', BULK: 'bg-blue-100 text-blue-800', EAT: 'bg-rose-100 text-rose-800', BLEND_OUT: 'bg-purple-100 text-purple-800', BLEND_IN: 'bg-purple-100 text-purple-800', ADJUST_IN: 'bg-amber-100 text-amber-800', EXPENSE: 'bg-orange-100 text-orange-800' };

function loadDb() {
    try {
        const d = JSON.parse(localStorage.getItem(LS_KEY));
        if (d && Array.isArray(d.txs)) return { txs: d.txs, batches: d.batches || [], pendingDeleteTx: d.pendingDeleteTx || [], pendingDeleteBatch: d.pendingDeleteBatch || [], running: d.running || null, runningDirty: !!d.runningDirty, bkMap: d.bkMap || {}, prices: d.prices || {}, pricesDirty: !!d.pricesDirty };
    } catch (e) {}
    return { txs: [], batches: [], pendingDeleteTx: [], pendingDeleteBatch: [], running: null, runningDirty: false, bkMap: {}, prices: {}, pricesDirty: false };
}
let db = loadDb();
let state = compute(db.txs, db.batches);
let ui = { tab: 'home', ledgerTab: 'batches', stockSort: 'cost', expanded: {}, openBatch: {}, txItem: '', txType: '', txQ: '', txView: 'table', alloc: (function () { try { const v = localStorage.getItem('sbx_alloc'); return v === 'weight' || v === 'price' ? v : 'cost'; } catch (e) { return 'cost'; } })(), itemOpen: {}, txLimit: 60, bfOpen: {} };

function persist() { try { ensureBk(); localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) {} }
function recompute() { state = compute(db.txs, db.batches); }
function refresh() { recompute(); persist(); render(); scheduleSync(); }

// ---------- ছোট ফাংশন ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 2) => { n = Number(n) || 0; if (Math.abs(n) < Math.pow(10, -d) / 2) n = 0; return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); };
const tk = n => '৳ ' + fmt(n);
const fg = n => { n = Number(n) || 0; return (Math.round(n * 10) / 10).toLocaleString('en-US') + ' g'; };
const round = (n, d) => Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
const profitCls = n => n >= 0 ? 'text-emerald-700' : 'text-red-600';
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dateStr(ms) { const d = new Date(ms); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function el(id) { return document.getElementById(id); }
function setVal(id, v) { const e = el(id); if (e) e.value = v; }
function setHtml(id, v) { const e = el(id); if (e) e.innerHTML = v; }
function toast(msg) { const t = el('toast'); t.textContent = msg; t.classList.remove('opacity-0'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('opacity-0'), 2600); }
const INP = 'w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm text-center font-semibold';
const INP_L = 'w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm font-semibold';

function makeTx(type, item, grams, pricePerKg, amountTk, ref, note, ts) {
    return { id: uid('t_'), ts, date: dateStr(ts), type, item, grams: round(grams, 3), pricePerKg: round(pricePerKg, 4), amountTk: round(amountTk, 4), ref: ref || '', note: note || '', synced: false };
}

// ---------- নেভিগেশন ও রেন্ডার ----------
function goTab(t) { ui.tab = t; render(); window.scrollTo(0, 0); }
function render() {
    updateBadge();
    ['home', 'stock', 'batch', 'ledger'].forEach(t => {
        const b = el('nav-' + t);
        b.className = 'py-2.5 flex flex-col items-center gap-0.5 ' + (ui.tab === t ? 'text-emerald-700' : 'text-gray-500');
    });
    let html = '';
    if (ui.tab === 'home') html = viewHome();
    else if (ui.tab === 'stock') html = viewStock();
    else if (ui.tab === 'batch') html = viewBatch();
    else html = viewLedger();
    el('view').innerHTML = html;
    if (!db.txs.length) obRender();
    else if (ui.tab === 'batch') batchPreview();
}

// ---------- হোম ----------

    const T = state.totals;
    const maxUsed = Math.max(1, ...state.items.map(i => i.usedCost));
    const eaten = state.items.filter(i => i.eatG > EPS || i.eatCost > 0.005).sort((a, b) => b.eatCost - a.eatCost);
    const maxEat = Math.max(1, ...eaten.map(i => i.eatCost));

    const low = state.items.filter(i => i.stock < 200);
    return `

    <div class="bg-white p-4 rounded-xl border border-emerald-200 shadow-sm bg-gradient-to-r from-emerald-50/60 to-teal-50/60 mb-3">
        <div class="flex items-center justify-between">
            <div>
                <span class="text-xs text-gray-600 font-bold block">লাইফটাইম নিট লাভ</span>
                <span class="text-[11px] text-gray-400">${state.batches.length}টি ব্যাচ • ${fmt(T.packets, 0)} প্যাকেট</span>
            </div>
            <span class="text-2xl font-extrabold ${profitCls(T.profit)}">${tk(T.profit)}</span>

    </div>
    <div class="grid grid-cols-2 gap-2 mb-3">

        ${statCard('fa-utensils', 'rose', 'খাওয়া/ঘাটতি খরচ', tk(T.eatCost))}
        ${statCard('fa-box', 'amber', 'ব্যবহার (প্যাকেট+বাল্ক)', tk(T.pktCost + T.bulkCost))}

    <div class="grid grid-cols-6 gap-1.5 mb-3 no-print">

        ${qa('fa-cart-plus', 'sky', 'রিস্টক', 'openRestock()')}
        ${qa('fa-utensils', 'rose', 'খাওয়া', 'openEat()')}
        ${qa('fa-scale-balanced', 'blue', 'বাল্ক', 'openBulk()')}
        ${qa('fa-blender', 'purple', 'ব্লেন্ড', 'openBlend()')}

    <div class="bg-gray-800 text-white p-4 rounded-xl shadow-lg mb-3">
        <h3 class="text-sm font-bold text-amber-400 mb-2 border-b border-gray-700 pb-1">লাইফটাইম হিসাব বিবরণী</h3>
        <div class="text-xs space-y-1.5 text-gray-300">

            ${row2('প্যাকেটে কাঁচামাল খরচ', '- ' + tk(T.pktCost), 'text-rose-300')}
            ${row2('বাল্ক বিক্রির কাঁচামাল খরচ', '- ' + tk(T.bulkCost), 'text-rose-300')}

    <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm mb-3">
        <h3 class="text-sm font-bold text-gray-700 mb-2 border-b pb-1"><i class="fa-solid fa-ranking-star text-amber-500 mr-1.5"></i>কোন আইটেমে কত খরচ হয়েছে</h3>
        ${used.length ? used.map(i => `
            <div class="mb-2">
                <div class="flex justify-between text-xs"><span class="font-bold text-gray-800">${esc(i.name)}</span><span class="text-gray-600">${fg(i.usedG)} • <b class="text-emerald-700">${tk(i.usedCost)}</b></span></div>

    </div>

    <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm mb-3">
        <h3 class="text-sm font-bold text-gray-700 mb-2 border-b pb-1"><i class="fa-solid fa-utensils text-rose-500 mr-1.5"></i>কোন আইটেম কতটুকু খাওয়া/ঘাটতি হয়েছে</h3>
        ${eaten.length ? eaten.map(i => `
            <div class="mb-2">
                <div class="flex justify-between text-xs"><span class="font-bold text-gray-800">${esc(i.name)}</span><span class="text-gray-600">${fg(i.eatG)} • <b class="text-rose-600">${tk(i.eatCost)}</b></span></div>

    </div>

    ${low.length ? `<div class="bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs text-amber-800 mb-3"><i class="fa-solid fa-bell mr-1"></i><b>কম স্টক (২০০g এর নিচে):</b> ${esc(low.map(i => i.name + ' (' + fg(i.stock) + ')').join(', '))}</div>` : ''}

    <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm mb-4 no-print">
        <h3 class="text-sm font-bold text-gray-700 mb-2 border-b pb-1"><i class="fa-solid fa-gear text-gray-500 mr-1.5"></i>টুলস</h3>
        ${cloudUser ? `<div class="text-[11px] text-gray-500 mb-2"><i class="fa-solid fa-user mr-1"></i>${esc(cloudUser.email || cloudUser.name || '')}</div>` : ''}
        <div class="grid grid-cols-2 gap-2 text-[11px] font-semibold">
            <button onclick="exportTxCsv()" class="bg-gray-100 hover:bg-gray-200 border rounded-lg py-2"><i class="fa-solid fa-file-csv mr-1"></i>লেনদেন CSV</button>
            <button onclick="exportItemsCsv()" class="bg-gray-100 hover:bg-gray-200 border rounded-lg py-2"><i class="fa-solid fa-file-csv mr-1"></i>আইটেম সামারি CSV</button>

            <button onclick="importLegacy(true)" class="bg-gray-100 hover:bg-gray-200 border rounded-lg py-2"><i class="fa-solid fa-cloud-arrow-up mr-1"></i>পুরোনো ডাটা তুলুন</button>

            <button onclick="clearLocal()" class="col-span-2 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-lg py-2"><i class="fa-solid fa-rotate mr-1"></i>এই ফোনের কপি মুছে ক্লাউড থেকে নতুন করে লোড (ক্লাউডের ডাটা মুছবে না)</button>

}
function statCard(icon, color, label, value) {
    return `<div class="bg-white p-2.5 rounded-xl border border-gray-200 shadow-sm flex items-center gap-2.5">
        <div class="p-2 bg-${color}-100 text-${color}-600 rounded-lg"><i class="fa-solid ${icon} text-lg"></i></div>
        <div><span class="text-[11px] text-gray-500 font-medium block">${label}</span><span class="text-sm font-bold text-gray-800">${value}</span></div></div>`;
}
function qa(icon, color, label, fn) {
    return `<button onclick="${fn}" class="bg-white border border-gray-200 hover:bg-${color}-50 rounded-xl py-2 flex flex-col items-center gap-1 shadow-sm"><i class="fa-solid ${icon} text-${color}-600"></i><span class="text-[10px] font-bold text-gray-700">${label}</span></button>`;
}
function row2(l, v, cls) { return `<div class="flex justify-between ${cls || ''}"><span>${l}</span><span class="font-bold">${v}</span></div>`; }

// ---------- শুরুর স্টক (অনবোর্ডিং) ----------
let ob = DEFAULT_ITEMS.map(x => ({ name: x[0], g: '1000', p: String(x[1]) }));
function viewOnboarding() {
    return `<div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm mb-4">
        <h2 class="text-sm font-bold text-gray-800 mb-1"><i class="fa-solid fa-flag-checkered text-emerald-600 mr-1.5"></i>শুরুর স্টক বসান</h2>
        <p class="text-xs text-gray-500 mb-3">এখন আপনার কাছে প্রতিটি আইটেম কত গ্রাম আছে এবং কেজি প্রতি কত টাকায় কিনেছেন, সেটা একবার বসান। এরপর থেকে সব হিসাব এই লেজারে জমা হবে। যে আইটেম নেই, তার গ্রাম ০ রাখুন বা মুছে দিন।</p>
        <div class="grid grid-cols-12 gap-1.5 text-[10px] text-gray-500 font-bold mb-1 px-0.5"><span class="col-span-5">আইটেম</span><span class="col-span-3 text-center">গ্রাম</span><span class="col-span-3 text-center">কেজি দর ৳</span><span></span></div>
        <div id="ob-rows"></div>
        <button onclick="obAdd()" class="text-xs text-emerald-700 font-bold mt-1"><i class="fa-solid fa-plus-circle mr-1"></i>আরেকটি আইটেম</button>
        <button onclick="obSave()" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow">লেজার শুরু করুন</button>
    </div>`;
}
function obRender() {
    const c = el('ob-rows'); if (!c) return;
    c.innerHTML = ob.map((r, i) => `<div class="grid grid-cols-12 gap-1.5 mb-1.5 items-center">
        <input class="col-span-5 ${INP_L} !p-1.5 !text-xs" value="${esc(r.name)}" oninput="ob[${i}].name=this.value">
        <input type="number" inputmode="decimal" class="col-span-3 ${INP} !p-1.5 !text-xs" value="${esc(r.g)}" oninput="ob[${i}].g=this.value">
        <input type="number" inputmode="decimal" class="col-span-3 ${INP} !p-1.5 !text-xs" value="${esc(r.p)}" oninput="ob[${i}].p=this.value">
        <button onclick="obDel(${i})" class="text-red-400 text-xs"><i class="fa-solid fa-trash-can"></i></button></div>`).join('');
}
function obAdd() { ob.push({ name: '', g: '', p: '' }); obRender(); }
function obDel(i) { ob.splice(i, 1); obRender(); }
function obSave() { if (!canWrite()) return;
    const rows = ob.filter(r => r.name.trim() && num(r.g) > 0);
    if (!rows.length) { alert('কমপক্ষে একটি আইটেমের নাম ও গ্রাম লিখুন'); return; }
    const names = rows.map(r => r.name.trim());
    if (new Set(names).size !== names.length) { alert('একই নামে একাধিক আইটেম আছে'); return; }
    const now = Date.now();
    rows.forEach((r, k) => db.txs.push(makeTx('OPENING', r.name.trim(), num(r.g), num(r.p), num(r.g) / 1000 * num(r.p), '', 'শুরুর স্টক', now + k)));
    refresh(); toast('শুরুর স্টক সেভ হয়েছে');
}

// ---------- স্টক ----------
function viewStock() {
    if (!db.txs.length) return viewOnboarding();
    const sorts = { cost: 'খরচ বেশি', low: 'স্টক কম', val: 'স্টক মূল্য', name: 'নাম' };
    let list = state.items.slice();
    if (ui.stockSort === 'cost') list.sort((a, b) => b.usedCost - a.usedCost);
    else if (ui.stockSort === 'low') list.sort((a, b) => a.stock - b.stock);
    else if (ui.stockSort === 'val') list.sort((a, b) => b.value - a.value);
    else list.sort((a, b) => a.name.localeCompare(b.name));
    const T = state.totals;
    return `

        <h2 class="text-base font-bold text-gray-800"><i class="fa-solid fa-cubes text-emerald-600 mr-1"></i>আইটেমভিত্তিক লাইফটাইম (${state.items.length})</h2>
        <button onclick="openRestock()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg shadow-sm"><i class="fa-solid fa-plus mr-1"></i>কেনা / নতুন আইটেম</button>

    </div>
    <div class="space-y-2.5 mb-4">${list.map(itemCard).join('')}</div>

    <div class="border rounded-xl overflow-hidden shadow-sm bg-white mb-4">
        <div class="bg-indigo-50 text-indigo-900 font-bold text-xs p-2 border-b">সব আইটেম এক নজরে</div>
        <div class="overflow-x-auto"><table class="w-full text-left text-[11px] whitespace-nowrap">

function sfRow(i, field, val) {

// টগল: লেজারের স্টককেই মাপা ওজন ধরে বসায় (ঘাটতি/বাড়তি শূন্য)
function sfAuto(i) {
    const it = state.items[i]; if (!it) return;
    const r = bf.rows[it.name] || (bf.rows[it.name] = {});
    if (r.auto) { r.auto = false; r.meas = ''; }
    else {
        if (it.stock <= EPS) { toast('এই আইটেমের স্টক নেই'); return; }
        r.auto = true; r.meas = String(round(it.stock, 2)); r.soldG = ''; r.soldTk = '';
    }
    saveDraft(); setVal('sf-in-' + i, r.meas);
    const b = el('sf-auto-' + i); if (b) { b.className = autoCls(!!r.auto); b.innerHTML = autoLbl(!!r.auto); }

function sfAutoAll() {
    const all = state.items.filter(it => it.stock > EPS && (!bf.only || bf.only.includes(it.name)));
    const allOn = all.length > 0 && all.every(it => (bf.rows[it.name] || {}).auto);
    all.forEach(it => {
        const r = bf.rows[it.name] || (bf.rows[it.name] = {});
        if (allOn) { r.auto = false; r.meas = ''; }
        else { r.auto = true; r.meas = String(round(it.stock, 2)); r.soldG = ''; r.soldTk = ''; }
    });
    saveDraft(); render();
}
function sfCompute() {
    const rows = [], errors = [];
    let eatCost = 0, soldRev = 0, soldCost = 0;
    state.items.forEach((it, i) => {
        const r = bf.rows[it.name] || {};
        if (r.meas === undefined || r.meas === '') return;
        const meas = r.auto ? it.stock : num(r.meas), diff = it.stock - meas;
        let short = 0, gain = 0, soldG = 0, soldTk = 0, eatG = 0;
        if (diff > EPS) {
            short = diff; soldG = num(r.soldG); soldTk = num(r.soldTk);
            if (soldG > short + EPS) errors.push(`${it.name}: বিক্রি (${fg(soldG)}) কম পাওয়া অংশের (${fg(short)}) চেয়ে বেশি`);
            eatG = Math.max(0, short - soldG);
        } else if (diff < -EPS) gain = -diff;
        const cEat = costNow(it, eatG), cSold = costNow(it, soldG);
        eatCost += cEat; soldRev += soldTk; soldCost += cSold;
        rows.push({ i, name: it.name, meas, short, gain, soldG, soldTk, eatG, cEat, cSold });
    });
    return { rows, errors, eatCost, soldRev, soldCost };
}

        if (!res) return;

        if (!row) { res.innerHTML = ''; ext.classList.add('hidden'); return; }

function ffTop(k, v) { bf[k] = v; saveDraft(); ffPreview(); }
function ffRow(i, val) { bfSet(i, runList(), 'end', val); ffPreview(); }
function ffCompute() {
    const run = db.running, list = runList();
    const P = num(bf.packets), pkg = num(bf.packaging), sell = num(bf.sell), other = num(bf.other);
    const sold = (bf.sold === undefined || bf.sold === '') ? P : num(bf.sold);
    const rows = [], errors = [], skipped = [];
    let pktCost = 0, replCost = 0;
    list.forEach((it, i) => {
        const r = bf.rows[it.name] || {};
        if (r.end === undefined || r.end === '') { skipped.push(i); return; }
        const end = num(r.end), used = it.stock - end;
        if (used < -EPS) { errors.push(`${it.name}: শেষের ওজন (${fg(end)}) এখনকার স্টক ${fg(it.stock)} এর চেয়ে বেশি হতে পারে না`); return; }
        const u = Math.max(0, used), c = costNow(it, u);
        pktCost += c; replCost += u / 1000 * it.repl;
        rows.push({ i, name: it.name, end, used: u, cost: c });
    });
    if (sold > P + EPS) errors.push(`বিক্রি (${fmt(sold, 0)}) প্যাকেট সংখ্যার (${fmt(P, 0)}) চেয়ে বেশি হতে পারে না`);
    const a = (run && state.byRef[run.id]) || emptyAgg();
    const totalPacketCost = pktCost + pkg;
    const cpp = totalPacketCost / (P > 0 ? P : 1);
    const revenue = sold * sell, packetProfit = revenue - totalPacketCost;
    const bulkProfit = a.bulkRev - a.bulkCost, eat = a.eatCost, exp = a.exp + other;
    const net = packetProfit + bulkProfit - eat - exp;
    const margin = cpp > 0 ? (sell - cpp) / cpp * 100 : 0;
    const replNet = net + (pktCost - replCost);
    return { P, sold, pkg, sell, other, exp, rows, errors, skipped, pktCost, replCost, replNet, totalPacketCost, cpp, revenue, packetProfit, bulkProfit, eat, net, margin, bulkRev: a.bulkRev, bulkCost: a.bulkCost };
}

        ${c.sold < c.P - EPS ? `<div class="text-amber-300 text-[11px]">অবিক্রীত ${fmt(c.P - c.sold, 0)} প্যাকেট। বিক্রি হলে লেজার → ব্যাচ → সম্পাদনা থেকে সংখ্যা বাড়ান।</div>` : ''}

function ffSave() { if (!canWrite()) return;
    const run = db.running; if (!run) return;
    const c = ffCompute();
    if (c.P <= 0) { alert('প্যাকেট সংখ্যা লিখুন'); return; }
    if (c.errors.length) { alert(c.errors.join('\n')); return; }
    if (!c.rows.length) { alert('কমপক্ষে একটি আইটেমের শেষের ওজন লিখুন'); return; }
    if (!c.rows.some(r => r.used > EPS)) { alert('কোনো আইটেমই কমেনি, শেষের ওজন আবার দেখুন'); return; }
    if (!confirm(`ব্যাচ শেষ করে সেভ করবেন?\n${fmt(c.P, 0)} প্যাকেট • প্যাকেট প্রতি খরচ ${tk(c.cpp)}\nনিট লাভ ${tk(c.net)}\n\nস্টক শেষের ওজন অনুযায়ী কমবে।`)) return;
    const now = Date.now();
    let finMeas;   // প্রতি আইটেমের শুরুর ও শেষের মাপা ওজন (পরে ভুল হলে ঠিক করার জন্য)
    if (run.m) {
        finMeas = {};
        Object.keys(run.m).forEach(n => { finMeas[n] = Object.assign({}, run.m[n], { end: null }); });
        c.rows.forEach(r => {
            const m = finMeas[r.name]; if (!m) return;
            m.end = r.end;
            const add = round(r.used + r.end - m.start, 3);   // শুরুর পর ব্যাচ চলাকালে স্টকে যা যোগ/বাদ হয়েছে (যেমন নতুন ব্লেন্ড, রিস্টক)
            m.added = Math.abs(add) < 0.001 ? 0 : add;
        });
    }
    db.batches.push({ id: run.id, ts: run.ts, date: run.date, packets: c.P, soldPackets: c.sold, packagingCost: c.pkg, sellingPrice: c.sell, note: bf.note || '', sp: Object.assign({}, db.prices || {}), meas: finMeas, synced: false,
        snap: { packetCost: round(c.totalPacketCost, 2), bulkRevenue: round(c.bulkRev, 2), bulkCost: round(c.bulkCost, 2), eatCost: round(c.eat, 2), otherCost: round(c.exp, 2), netProfit: round(c.net, 2), margin: round(c.margin, 2) } });
    let k = 1;
    c.rows.forEach(r => { if (r.used > EPS) { const pt = makeTx('PACKET', r.name, r.used, 0, r.cost, run.id, '', now + (k++)); pt.grp = 'p'; db.txs.push(pt); } });
    if (c.other > 0) db.txs.push(makeTx('EXPENSE', 'অন্যান্য খরচ', 0, 0, c.other, run.id, 'ব্যাচের অন্যান্য খরচ', now + (k++)));
    db.running = null; db.runningDirty = true; bfReset();
    ui.tab = 'home'; refresh(); window.scrollTo(0, 0); toast('ব্যাচ সেভ হয়েছে');
}
function runCancel(all) { if (!canWrite()) return;
    const run = db.running; if (!run) return;
    if (all) { deleteGroup(run.id); return; }
    if (!confirm('ব্যাচ বাতিল করবেন? শুরুতে ধরা ঘাটতি ও স্টক সংশোধন লেজারে থেকে যাবে।')) return;
    db.running = null; db.runningDirty = true; bfReset(); refresh(); toast('ব্যাচ বাতিল হয়েছে');
}

function txEditSave(id) {
    if (!canWrite()) return;
    const t = db.txs.find(x => x.id === id); if (!t) return;
    const F = TX_EDIT_FIELDS[t.type] || ['note'], has = k => F.includes(k), nt = Object.assign({}, t);
    nt.note = el('te-note').value.trim();
    if (has('item')) nt.item = el('te-item').value;
    if (has('cat')) nt.item = el('te-cat').value;
    if ((has('item') || has('cat')) && !String(nt.item || '').trim()) { alert('আইটেম বেছে নিন'); return; }
    if (has('grams')) { nt.grams = round(num(el('te-g').value), 3); if (nt.grams <= 0) { alert('গ্রাম লিখুন'); return; } }
    if (has('price')) { nt.pricePerKg = round(num(el('te-p').value), 4); if (nt.pricePerKg <= 0) { alert('কেজি দর লিখুন'); return; } }
    if (t.type === 'OPENING' || t.type === 'RESTOCK') nt.amountTk = round(nt.grams / 1000 * nt.pricePerKg, 4);
    if (has('total')) { nt.amountTk = round(num(el('te-t').value), 4); if (nt.amountTk < 0 || (t.type === 'EXPENSE' && nt.amountTk <= 0)) { alert('টাকার অঙ্ক ঠিকমতো লিখুন'); return; } }
    if (has('date')) {
        const v = el('te-date').value;

        if (v !== dayKey(t.ts)) {

            nt.date = dateStr(nt.ts);
        }
    }
    // বদলের পর কোনো আইটেমের স্টক মাইনাসে গেলে আটকাই

}

// ---------- মোছা ----------
function deleteTx(id) {
    if (measGuard(db.txs.find(x => x.id === id))) return;
    const t = db.txs.find(x => x.id === id); if (!t) return;
    if (t.type !== 'EXPENSE' && t.ref) { deleteGroup(t.ref); return; }
    tryDelete([id], null, 'এই লেনদেনটি মুছবেন?');
}
function deleteGroup(ref) {
    const ids = db.txs.filter(t => t.ref === ref).map(t => t.id);
    const isBatch = ref.indexOf('b_') === 0;
    tryDelete(ids, isBatch ? ref : null, isBatch ? 'পুরো ব্যাচ ও তার সব এন্ট্রি মুছবেন? স্টক আগের অবস্থায় ফিরবে।' : 'পুরো ব্লেন্ডের সব এন্ট্রি মুছবেন?');
}
function tryDelete(ids, batchId, msg) { if (!canWrite()) return; ensureBk();
    const idSet = new Set(ids);
    const remTx = db.txs.filter(t => !idSet.has(t.id));
    const remB = db.batches.filter(b => b.id !== batchId);
    const test = compute(remTx, remB);
    if (test.negatives.length) { alert('এটি মুছলে ' + [...new Set(test.negatives.map(n => n.item))].join(', ') + ' এর স্টক মাইনাসে চলে যাবে। আগে পরের এন্ট্রিগুলো মুছুন।'); return; }
    if (!confirm(msg)) return;
    const delTs = db.txs.filter(t => idSet.has(t.id)).map(t => t.ts).concat(batchId ? (db.batches.filter(b => b.id === batchId).map(b => b.ts)) : []);
    db.pendingDeleteTx.push(...ids);
    if (batchId) db.pendingDeleteBatch.push(batchId);
    db.txs = remTx; db.batches = remB;
    if (batchId && db.running && db.running.id === batchId) { db.running = null; db.runningDirty = true; }
    const ch = delTs.length ? reconcileStarts(Math.min(...delTs) - 1) : [];
    refresh(); notifyReconcile(ch, 'মুছে ফেলা হয়েছে');
}

// ব্যাচ শুরুর ওজন-মেলানো এন্ট্রি (ঘাটতি / ঘাটতি থেকে বিক্রি / বাড়তি) বানায়

// আগের ব্লেন্ডের শেষ রেসিপি (উপাদান ও গ্রাম)
function blendRecipe(name) {
    const ins = db.txs.filter(t => t.type === 'BLEND_IN' && t.item === name).sort((a, b) => b.ts - a.ts);
    if (!ins.length) return null;
    const rows = db.txs.filter(t => t.type === 'BLEND_OUT' && t.ref === ins[0].ref)
        .map(t => { const it = state.map[t.item]; return it ? { i: it.idx, g: num(t.grams) } : null; }).filter(Boolean);

}
function blendLoad(name) {

        blendRows = rec.map(r => ({ i: r.i, g: String(r.g) }));
        el('bl-total').value = Math.round(rec.reduce((s, r) => s + r.g, 0));
        el('bl-scale').classList.remove('hidden');
    } else {

}

    const T = num(v), sum = blendBase ? blendBase.reduce((s, r) => s + r.g, 0) : 0;
    if (!blendBase || sum <= 0) return;
    blendRows = blendBase.map(r => ({ i: r.i, g: T > 0 ? String(Math.round(r.g / sum * T * 10) / 10) : '' }));
    blendRender();
}
function blendRender() {
    el('bl-rows').innerHTML = blendRows.map((r, k) => `<div class="flex items-center gap-2">
        <select onchange="blendRows[${k}].i=parseInt(this.value);blendPreview()" class="flex-1 border p-1.5 rounded text-xs">${state.items.map(i => `<option value="${i.idx}" ${i.idx === r.i ? 'selected' : ''}>${esc(i.name)} (${fg(i.stock)})</option>`).join('')}</select>
        <input type="number" inputmode="decimal" value="${esc(r.g)}" oninput="blendRows[${k}].g=this.value;blendPreview()" class="w-24 border p-1.5 rounded text-xs text-center font-bold" placeholder="গ্রাম">
        <button onclick="blendDel(${k})" class="text-red-500 p-1"><i class="fa-solid fa-xmark"></i></button></div>`).join('');
    blendPreview();
}
function blendAdd() { blendRows.push({ i: 0, g: '' }); blendRender(); }
function blendDel(k) { if (blendRows.length <= 1) return; blendRows.splice(k, 1); blendRender(); }
function blendCalc() {
    const per = {};
    blendRows.forEach(r => { const g = num(r.g); if (g > 0) per[r.i] = (per[r.i] || 0) + g; });
    let tg = 0, tc = 0; const errors = [], parts = [];
    Object.keys(per).forEach(k => {
        const it = state.items[parseInt(k)], g = per[k], c = costNow(it, g);
        if (g > it.stock + 1e-6) errors.push(`${it.name}: স্টক ${fg(it.stock)} এর চেয়ে বেশি`);
        tg += g; tc += c; parts.push({ it, g, c });

}
function blendPreview() {
    const c = blendCalc();
    const nmEl = el('bl-name'), nm = nmEl ? nmEl.value.trim() : '', ex = nm && state.map[nm];
    const joinHtml = (ex && ex.isMixed && c.net > 0)
        ? `<div class="border-t border-purple-200 pt-1 mt-1 space-y-0.5"><div class="text-purple-800 font-bold">আগের ব্লেন্ডে যুক্ত হবে</div>${row2('এখন স্টক', fg(ex.stock) + ' • ৳' + fmt(ex.avg) + '/কেজি')}${row2('যুক্ত হওয়ার পর স্টক', fg(ex.stock + c.net))}<div class="flex justify-between font-extrabold text-purple-900"><span>নতুন গড় কেজি দর</span><span>৳ ${fmt((ex.value + c.tc) / (ex.stock + c.net) * 1000)}/কেজি</span></div></div>` : '';
    setHtml('bl-prev', `${row2('মোট উপাদান ওজন', fg(c.tg))}${c.loss > 0 ? row2('ওজন কমা/নষ্ট', '- ' + fg(c.loss)) : ''}${row2('ব্লেন্ডের ওজন', fg(c.net))}${row2('মোট খরচ', tk(c.tc))}<div class="flex justify-between font-extrabold text-purple-900"><span>গড় কেজি দর</span><span>৳ ${fmt(c.avg)}/কেজি</span></div>${joinHtml}${c.errors.length ? '<div class="text-red-600">' + esc(c.errors.join(' | ')) + '</div>' : ''}`);
}
function blendSave() { if (!canWrite()) return;
    const name = el('bl-name').value.trim(), c = blendCalc();

    if (c.tg <= 0) { alert('উপাদান ও গ্রাম লিখুন'); return; }
    if (c.errors.length) { alert(c.errors.join('\n')); return; }
    if (c.parts.some(p => p.it.name === name)) { alert('ব্লেন্ডের নাম উপাদানের নামের সমান হতে পারে না'); return; }
    const ex = state.map[name];
    if (ex && !ex.isMixed) { alert('এই নামে সাধারণ আইটেম আছে, অন্য নাম দিন'); return; }
    const now = Date.now(), ref = uid('bl_');

    all.forEach(o => { if (o._bk) cnt[o._bk] = (cnt[o._bk] || 0) + 1; });
    all.forEach(o => {
        if (!o._bk) {
            const base = dayKey(o.ts); let k = base, n = 1;
            while ((cnt[k] || 0) >= BK_MAX) { n++; k = base + '-' + n; }
            o._bk = k; cnt[k] = (cnt[k] || 0) + 1;
        }
        db.bkMap[o.id] = o._bk;
    });
}

// ---- ক্লাউড থেকে শোনা (শুধু বদলানো বাকেট আসে) ----
function detach() { unsubs.forEach(f => { try { f(); } catch (e) {} }); unsubs = []; }
function onListenErr(err) { lastErr = err; updateBadge(); if (err && err.code === 'permission-denied') toast('অনুমতি নেই: Firestore সিকিউরিটি রুলস দেখুন'); }
function applyBucket(bk, data) {
    let changed = false; const ids = new Set();
    db.bkMap = db.bkMap || {};
    Object.keys(data).forEach(k => {
        if (k === 'u' || typeof data[k] !== 'string') return;
        let o; try { o = JSON.parse(data[k]); } catch (e) { return; }
        if (!o || o.id !== k) return;
        ids.add(k);
        const isB = k.startsWith('b_'), list = isB ? db.batches : db.txs, pd = isB ? db.pendingDeleteBatch : db.pendingDeleteTx;
        if (pd.includes(k)) return;
        const obj = Object.assign(o, { synced: true, _bk: bk, _sat: Date.now() });
        db.bkMap[k] = bk;
        const i = list.findIndex(x => x.id === k);
        if (i < 0) { list.push(obj); changed = true; return; }
        const loc = list[i];
        if (!loc.synced) {   // এই ডিভাইসের অসেভ পরিবর্তন থাকলে তা-ই থাকে
            if (canon(plain(loc)) === canon(plain(obj))) { loc.synced = true; loc._sat = Date.now(); }
            return;
        }
        if (canon(plain(loc)) !== canon(plain(obj))) { list[i] = obj; changed = true; }
    });
    // অন্য ডিভাইসে মোছা: এই বাকেটের সিঙ্ক করা আইটেম ডকুমেন্টে আর নেই
    // (এইমাত্র সিঙ্ক হওয়া আইটেম ৫ সেকেন্ড ছাড় পায়, তারপর আবার যাচাই হয়)
    const snapAt = Date.now(); let held = false;
    const gone = x => {
        if (!(x.synced && x._bk === bk && !ids.has(x.id))) return false;
        if (x._sat && snapAt - x._sat < 5000) { held = true; return false; }
        return true;
    };
    ['txs', 'batches'].forEach(key => { const n = db[key].length; db[key] = db[key].filter(x => !gone(x)); if (db[key].length !== n) changed = true; });
    if (held) setTimeout(() => {
        let ch = false;
        ['txs', 'batches'].forEach(key => { const n = db[key].length; db[key] = db[key].filter(x => !(x.synced && x._bk === bk && !ids.has(x.id) && x._sat !== undefined && x._sat <= snapAt)); if (db[key].length !== n) ch = true; });
        if (ch) { recompute(); persist(); renderSoon(); }
    }, 5500);
    // মোছার নিশ্চিতকরণ: বাকেটে আইডি আর নেই
    const isConf = id => db.bkMap[id] === bk && !ids.has(id);
    const conf = db.pendingDeleteTx.filter(isConf).concat(db.pendingDeleteBatch.filter(isConf));
    if (conf.length) {
        db.pendingDeleteTx = db.pendingDeleteTx.filter(id => !isConf(id));
        db.pendingDeleteBatch = db.pendingDeleteBatch.filter(id => !isConf(id));
        conf.forEach(id => { delete db.bkMap[id]; });
    }
    return changed;
}
function attachListeners() {
    detach();
    if (!FB || !cloudUser || DEMO) return;
    const { fs, f } = FB, uid = cloudUser.uid, lastKey = 'sbx_lastu2_' + uid;
    const since = f.Timestamp.fromMillis(Number(localStorage.getItem(lastKey)) || 0);
    let maxU = 0;
    const finish = changed => {
        if (maxU) { const nv = maxU - 10000, prev = Number(localStorage.getItem(lastKey)) || 0; if (nv > prev) { try { localStorage.setItem(lastKey, String(nv)); } catch (e) {} } }
        recompute(); persist();
        if (changed) renderSoon(); else updateBadge();
    };
    const uOf = data => (data && data.u && data.u.toMillis) ? data.u.toMillis() : 0;

    unsubs.push(f.onSnapshot(f.query(f.collection(fs, 'users', uid, 'd'), f.where('u', '>', since)), snap => {
        let changed = false;
        snap.docChanges().forEach(ch => {
            const d = ch.doc, data = d.data();
            maxU = Math.max(maxU, uOf(data));
            if (d.metadata.hasPendingWrites || ch.type === 'removed') return;
            if (applyBucket(d.id, data)) changed = true;
        });
        finish(changed);
    }, onListenErr));

    const myEmail = (cloudUser.email || '').toLowerCase();
    if (isAdminUser()) { setAcc({ plan: 'admin', untilMs: 0 }); }
    else if (myEmail) {
        let creating = false;
        unsubs.push(f.onSnapshot(f.doc(fs, 'access', myEmail), d => {
            if (d.exists()) { const a = accFromDoc(d.data()); if (a) { setAcc(a); scheduleSync(); } return; }
            if (d.metadata.fromCache) return;   // সার্ভারের উত্তর না আসা পর্যন্ত অপেক্ষা
            if (!creating) {
                creating = true;   // প্রথমবার লগইন: ৭ দিনের ফ্রি ট্রায়াল শুরু
                f.setDoc(f.doc(fs, 'access', myEmail), { email: myEmail, plan: 'trial', createdAt: f.serverTimestamp() }).catch(onListenErr);
            }
        }, onListenErr));
    }

    unsubs.push(f.onSnapshot(f.doc(fs, 'users', uid, 'meta', 'prices'), d => {
        if (d.metadata.hasPendingWrites || !d.exists() || db.pricesDirty) return;
        let p = {}; try { p = JSON.parse(d.data().p) || {}; } catch (e) {}
        if (canon(p) !== canon(db.prices || {})) { db.prices = p; finish(true); }
    }, onListenErr));

    unsubs.push(f.onSnapshot(f.doc(fs, 'users', uid, 'meta', 'running'), d => {
        if (d.metadata.hasPendingWrites || !d.exists() || db.runningDirty) return;
        let run = null; try { const data = d.data(); run = data && data.run ? JSON.parse(data.run) : null; } catch (e) {}
        if (canon(run) !== canon(db.running)) { db.running = run; finish(true); }
    }, onListenErr));
}

// ---- পুরোনো কাঠামো (tx / batches আলাদা ডকুমেন্ট) থেকে একবার নতুন কাঠামোয় আনা ----
async function ensureSchema() {
    const uid = cloudUser.uid, key = 'sbx_schema2_' + uid, migKey = 'sbx_mig_' + uid;
    if (localStorage.getItem(key) === '1') return;
    const { fs, f } = FB, sref = f.doc(fs, 'users', uid, 'meta', 'schema');
    if (!localStorage.getItem(migKey)) {
        const s = await f.getDoc(sref);
        if (s.exists() && s.data().v >= 2) { localStorage.setItem(key, '1'); return; }
        const [a, b] = await Promise.all([f.getDocs(f.collection(fs, 'users', uid, 'tx')), f.getDocs(f.collection(fs, 'users', uid, 'batches'))]);
        const clean = o => { const x = Object.assign({}, o); delete x.u; delete x.deleted; return x; };
        a.forEach(d => { const o = d.data(); if (!o || o.deleted || db.txs.some(t => t.id === d.id)) return; db.txs.push(Object.assign(clean(o), { id: d.id, synced: false })); });
        b.forEach(d => { const o = d.data(); if (!o || o.deleted || db.batches.some(x => x.id === d.id)) return; db.batches.push(Object.assign(clean(o), { id: d.id, synced: false })); });
        db.txs.forEach(t => { t.synced = false; }); db.batches.forEach(x => { x.synced = false; });   // সবই নতুন কাঠামোয় যাবে
        persist(); recompute();
        try { localStorage.setItem(migKey, '1'); } catch (e) {}
    }
    await finalizeSchema();
}
async function finalizeSchema() {
    const uid = cloudUser.uid, key = 'sbx_schema2_' + uid, migKey = 'sbx_mig_' + uid;
    if (localStorage.getItem(key) === '1' || !localStorage.getItem(migKey) || pendingCount() > 0) return;
    const { fs, f } = FB;
    await f.setDoc(f.doc(fs, 'users', uid, 'meta', 'schema'), { v: 2, at: f.serverTimestamp() });
    try { localStorage.setItem(key, '1'); localStorage.removeItem(migKey); } catch (e) {}
}

// ---- ক্লাউডে পাঠানো (offline হলে Firebase নিজে জমা রাখে) ----
async function pushPending(manual) {
    const { fs, f } = FB, uid = cloudUser.uid, groups = {}, ops = [];
    ensureBk();
    const grp = bk => groups[bk] || (groups[bk] = { fields: {}, keys: {}, applies: [] });
    const addItem = (listFn, o) => {
        const c = plain(o), sg = canon(c), key = 'i:' + o.id;
        if (queued[key] === sg) return;
        const G = grp(o._bk);
        G.fields[o.id] = JSON.stringify(c); G.keys[key] = sg;
        G.applies.push(() => { const x = listFn().find(y => y.id === o.id); if (x && canon(plain(x)) === sg) { x.synced = true; x._sat = Date.now(); } });
    };
    db.txs.filter(t => !t.synced).forEach(t => addItem(() => db.txs, t));
    db.batches.filter(b => !b.synced).forEach(b => addItem(() => db.batches, b));
    const addDel = (id, drop) => {
        const bk = db.bkMap && db.bkMap[id], key = 'd:' + id;
        if (!bk) { drop(); return; }   // কখনো ক্লাউডে যায়নি, তাই মোছার কিছু নেই
        if (queued[key]) return;
        const G = grp(bk);
        G.fields[id] = f.deleteField(); G.keys[key] = 'd';
        G.applies.push(() => { drop(); if (db.bkMap) delete db.bkMap[id]; });
    };
    db.pendingDeleteTx.slice().forEach(id => addDel(id, () => { db.pendingDeleteTx = db.pendingDeleteTx.filter(x => x !== id); }));
    db.pendingDeleteBatch.slice().forEach(id => addDel(id, () => { db.pendingDeleteBatch = db.pendingDeleteBatch.filter(x => x !== id); }));
    Object.keys(groups).forEach(bk => {
        const G = groups[bk];
        ops.push({ keys: G.keys, applies: G.applies, ref: f.doc(fs, 'users', uid, 'd', bk), data: Object.assign({}, G.fields, { u: f.serverTimestamp() }) });
    });
    if (db.runningDirty) {
        const run = db.running ? JSON.stringify(db.running) : null, key = 'run', sg = 'r:' + run;
        if (queued[key] !== sg) ops.push({ keys: { [key]: sg }, applies: [() => { if (db.runningDirty && (db.running ? JSON.stringify(db.running) : null) === run) db.runningDirty = false; }], ref: f.doc(fs, 'users', uid, 'meta', 'running'), data: { run, u: f.serverTimestamp() } });
    }
    if (db.pricesDirty) {
        const pj = JSON.stringify(db.prices || {}), key = 'prices', sg = 'p:' + pj;
        if (queued[key] !== sg) ops.push({ keys: { [key]: sg }, applies: [() => { if (db.pricesDirty && JSON.stringify(db.prices || {}) === pj) db.pricesDirty = false; }], ref: f.doc(fs, 'users', uid, 'meta', 'prices'), data: { p: pj, u: f.serverTimestamp() } });
    }
    for (let i = 0; i < ops.length; i += 15) {   // রুলসে ব্যাচড রাইটে অ্যাক্সেস-কলের সীমা আছে, তাই ছোট ভাগে পাঠাই
        const chunk = ops.slice(i, i + 15), wb = f.writeBatch(fs);
        chunk.forEach(o => { wb.set(o.ref, o.data, { merge: true }); Object.assign(queued, o.keys); });
        const release = () => chunk.forEach(o => Object.keys(o.keys).forEach(k => delete queued[k]));
        const p = wb.commit().then(() => { chunk.forEach(o => o.applies.forEach(a => a())); release(); lastErr = null; persist(); updateBadge(); })
            .catch(err => { release(); lastErr = err; if (err && err.code === 'permission-denied') toast('অনুমতি নেই: Firestore সিকিউরিটি রুলস দেখুন'); updateBadge(); })
            .finally(() => inflight.delete(p));
        inflight.add(p);
    }
    if (inflight.size) await Promise.race([Promise.allSettled([...inflight]), sleep(manual ? 12000 : 8000)]);
}
async function syncNow(manual) {
    if (DEMO) { updateBadge(); if (manual) toast('ডেমো মোড: ডাটা শুধু এই ফোনে থাকে'); return; }
    if (!cloudUser) { if (manual) showLogin(); return; }
    if (!FB) {
        try { startAuth(await loadFirebase()); } catch (e) { updateBadge(); if (manual) toast('ইন্টারনেট নেই বা সার্ভারে যোগাযোগ হয়নি'); return; }
    }
    if (!FB.auth.currentUser) { updateBadge(); return; }   // লগইন যাচাই শেষ হলে onAuth নিজেই সিঙ্ক চালাবে
    if (!acc.known) { updateBadge(); if (manual) toast('অ্যাকাউন্টের মেয়াদ যাচাই হচ্ছে, একটু পরে আবার চাপুন'); return; }
    if (!acc.ok) { updateBadge(); if (manual) canWrite(); return; }
    if (syncing) { syncAgain = true; return; }
    syncing = true; updateBadge();
    try { await ensureSchema(); await pushPending(manual); await finalizeSchema(); } catch (e) { lastErr = e; }
    syncing = false; lastSyncAt = Date.now(); persist(); updateBadge();
    const p = pendingCount();
    if (manual) toast(p ? 'কিছু এন্ট্রি এখনো যায়নি, নেট থাকলে নিজে চলে যাবে' : 'সবকিছু ক্লাউডে আছে');
    if (p > 0 && navigator.onLine && retryN < 5) { retryN++; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 3000 * Math.pow(2, retryN - 1)); }
    else if (!p) retryN = 0;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
}
function clearLocal() {
    if (DEMO) { resetDemo(); return; }
    if (db.running && !confirm('একটি ব্যাচ চলছে। ক্যাশ মুছলে চলমান ব্যাচের তথ্য হারাবে। তবু মুছবেন?')) return;
    if (pendingCount() > 0 && !confirm('ক্লাউডে যায়নি এমন ' + pendingCount() + 'টি এন্ট্রি আছে, মুছলে সেগুলো হারাবে। তবু মুছবেন?')) return;
    if (!pendingCount() && !confirm('এই ফোনের কপি মুছে ক্লাউড থেকে নতুন করে লোড করবেন?')) return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_DRAFT);
    if (cloudUser) localStorage.removeItem('sbx_lastu2_' + cloudUser.uid);
    location.reload();
}
function bootCloud() {
    const hd = document.querySelector('header'); if (hd && !el('acc-banner')) hd.insertAdjacentHTML('afterend', '<div id="acc-banner" class="no-print"></div>');
    setInterval(() => { if (acc.known && cloudUser) { acc.ok = acc.plan === 'admin' || acc.untilMs > Date.now(); renderAccBanner(); updateBadge(); } }, 60000);
    let last = null; try { last = JSON.parse(localStorage.getItem('sbx_last_user')); } catch (e) {}
    if (last && last.uid) enterApp(last, false); else showLogin();
    loadFirebase().then(startAuth).catch(() => { updateBadge(); if (!cloudUser) showLogin(getFbConfig() ? 'ইন্টারনেট চালু করে আবার চেষ্টা করুন' : ''); });
}

// ---------- ডেমো মোড ----------
function seedDemo() {
    const D = 86400000, now = Date.now();
    const add = (type, item, g, p, amt, ref, note, ts) => { const t = makeTx(type, item, g, p, amt, ref, note, ts); t.synced = true; db.txs.push(t); };
    const t0 = now - 20 * D;
    [['কাঠবাদাম', 5000, 1300], ['কাজুবাদাম', 3000, 1400], ['কিসমিস', 4000, 900], ['আখরোট', 2000, 1000]]
        .forEach((x, k) => add('OPENING', x[0], x[1], x[2], x[1] / 1000 * x[2], '', 'শুরুর স্টক', t0 + k));
    add('RESTOCK', 'কিসমিস', 3000, 1000, 3000, '', 'নতুন কেনা', now - 14 * D);
    add('RESTOCK', 'কাজুবাদাম', 2000, 1500, 3000, '', 'নতুন কেনা', now - 13 * D);
    const mkBatch = (days, packets, pkg, sell, sold, uses, other, note) => {
        const ts = now - days * D, id = uid('b_'); let k = 1;
        db.batches.push({ id, ts, date: dateStr(ts), packets, soldPackets: sold, packagingCost: pkg, sellingPrice: sell, note, synced: true });
        recompute();
        uses.forEach(u => { const it = state.map[u[0]]; add('PACKET', u[0], u[1], 0, u[1] / 1000 * (it ? it.avg : 0), id, '', ts + (k++)); });
        if (other > 0) add('EXPENSE', 'অন্যান্য খরচ', 0, 0, other, id, 'ব্যাচের অন্যান্য খরচ', ts + (k++));
        recompute();
        const r = state.batches.find(x => x.id === id), b = db.batches.find(x => x.id === id);
        if (r) b.snap = { packetCost: round(r.totalPacketCost, 2), bulkRevenue: round(r.bulkRev, 2), bulkCost: round(r.bulkCost, 2), eatCost: round(r.eatCost, 2), otherCost: round(r.otherCost, 2), netProfit: round(r.net, 2), margin: round(r.margin, 2) };
    };
    mkBatch(9, 40, 200, 160, 36, [['কাঠবাদাম', 1000], ['কাজুবাদাম', 800], ['কিসমিস', 600], ['আখরোট', 600]], 0, 'ডেমো ব্যাচ ১');
    add('EAT', 'কিসমিস', 100, 0, 0, '', 'নমুনা: টেস্ট করা হয়েছে', now - 6 * D);
    add('BULK', 'কাঠবাদাম', 500, 0, 700, '', 'নমুনা: খুচরা বিক্রি', now - 5 * D);
    add('EAT', 'কাজুবাদাম', 50, 0, 0, '', 'নমুনা: নষ্ট/ঘাটতি', now - 4 * D);
    mkBatch(3, 30, 150, 150, 30, [['কাঠবাদাম', 800], ['কাজুবাদাম', 600], ['কিসমিস', 700], ['আখরোট', 400]], 300, 'ডেমো ব্যাচ ২ (ডেলিভারি খরচসহ)');
    add('EXPENSE', 'বিজ্ঞাপন', 0, 0, 500, '', 'নমুনা: ফেসবুক বুস্ট', now - 2 * D);
}
function initDemo() {
    if (!db.txs.length && !db.batches.length) { seedDemo(); recompute(); persist(); }
    const h = document.querySelector('header');
    if (h) h.insertAdjacentHTML('afterend', '<div class="no-print bg-amber-100 text-amber-900 text-xs font-semibold px-3 py-1.5 flex justify-between items-center"><span><i class="fa-solid fa-flask mr-1"></i>ডেমো মোড: নমুনা ডাটা, সবকিছু ফোনেই থাকে, সার্ভারে যায় না</span><button onclick="resetDemo()" class="underline">রিসেট</button></div>');
}
function resetDemo() {
    if (!confirm('ডেমো ডাটা মুছে নতুন করে নমুনা ডাটা দিয়ে শুরু করবেন?')) return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_DRAFT); location.reload();
}

window.addEventListener('online', () => {
    if (DEMO) return;
    if (!FB) loadFirebase().then(startAuth).catch(() => {});
    else scheduleSync();
    updateBadge();
});
window.addEventListener('offline', updateBadge);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !DEMO && cloudUser && Date.now() - lastSyncAt > 15000) scheduleSync(); });
window.addEventListener('DOMContentLoaded', () => { if (DEMO) { initDemo(); render(); updateBadge(); } else bootCloud(); });
