<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শর্তাবলি, প্রাইভেসি পলিসি ও রিফান্ড নীতি</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, "Noto Sans Bengali", sans-serif; background:#f3f4f6; color:#111827; margin:0; line-height:1.75; }
  main { max-width: 720px; margin: 0 auto; padding: 14px; }
  section { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:6px 0 4px; } h2 { font-size:17px; margin:0 0 6px; color:#065f46; }
  p, li { font-size:14px; } ul { padding-left:20px; margin:6px 0; }
  nav a { display:inline-block; margin:2px 8px 2px 0; font-size:13px; color:#047857; }
  .draft { background:#fef3c7; border:1px solid #f59e0b; color:#92400e; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .muted { color:#6b7280; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>শর্তাবলি, প্রাইভেসি পলিসি ও রিফান্ড নীতি</h1>
  <nav><a href="#terms">শর্তাবলি</a><a href="#privacy">প্রাইভেসি পলিসি</a><a href="#refund">রিফান্ড নীতি</a></nav>
  <div id="draft" class="draft" style="display:none"></div>
  <div id="content"></div>
  <p class="muted" id="foot"></p>
</main>

<script>
// ============ এখানে নিজের তথ্য বসান (ফোনে GitHub-এ এডিট করে) ============
const SELLER = 'সেবাদাতা';                 // আপনার নাম বা প্রতিষ্ঠানের নাম
const PRODUCT = 'লেজার অ্যাপ';              // পণ্যের নাম
const CONTACT = '01614962727';              // WhatsApp / ফোন নম্বর
const TRIAL_DAYS = 7;                       // ফ্রি ট্রায়ালের দিন (অ্যাপের সাথে মিল রাখুন)
const REFUND_DAYS = 3;                      // পেইড মেয়াদ শুরুর কত দিনের মধ্যে ফেরতের অনুরোধ নেওয়া হবে (০ হলে ফেরত নেই)
const UPDATED = '২০২৬';                    // সর্বশেষ হালনাগাদ
const SHOW_DRAFT_NOTICE = true;             // নিজে মিলিয়ে নেওয়ার পর false করুন
// =========================================================================

const T = {
  terms: `
<h2>শর্তাবলি</h2>
<p>${PRODUCT} ব্যবহার করলে আপনি নিচের শর্তগুলোতে সম্মত হচ্ছেন। এই অ্যাপ দিয়ে ${SELLER} আপনাকে স্টক, কেনা-বেচা ও লাভ-ক্ষতির হিসাব রাখার সুবিধা দেয়।</p>
<ul>
 <li><b>অ্যাকাউন্ট:</b> আপনি Google (Gmail) দিয়ে লগইন করেন। অ্যাকাউন্টের নিরাপত্তা আপনার দায়িত্ব। আপনার Gmail হারালে বা বন্ধ হলে ডাটা ফিরে পাওয়া কঠিন হতে পারে।</li>
 <li><b>ফ্রি ট্রায়াল:</b> নতুন অ্যাকাউন্ট প্রথমবার লগইনের পর ${TRIAL_DAYS} দিন বিনা টাকায় সব সুবিধা ব্যবহার করতে পারে। প্রতিজন একটি ট্রায়াল পাওয়ার কথা।</li>
 <li><b>সাবস্ক্রিপশন:</b> ট্রায়াল বা পেইড মেয়াদ শেষ হলে আপনি আপনার ডাটা দেখতে ও CSV হিসেবে নামাতে পারবেন, কিন্তু নতুন এন্ট্রি দিতে পারবেন না। মেয়াদ বাড়ালে আবার চালু হবে এবং আপনার ডাটা থেকে যাবে।</li>
 <li><b>পেমেন্ট:</b> পেমেন্ট ও মেয়াদ বাড়ানোর জন্য ${CONTACT} নম্বরে যোগাযোগ করতে হবে। পেমেন্ট নিশ্চিত হওয়ার পর মেয়াদ চালু করা হয়।</li>
 <li><b>সঠিক ব্যবহার:</b> অন্যের অ্যাকাউন্টে অনুমতি ছাড়া প্রবেশ, সিস্টেমের নিরাপত্তা ভাঙার চেষ্টা, বা অ্যাপের কোড অনুমতি ছাড়া কপি করে বিক্রি করা নিষিদ্ধ। নিয়ম ভাঙলে অ্যাক্সেস বন্ধ করা হতে পারে।</li>
 <li><b>হিসাবের দায়:</b> অ্যাপ আপনার দেওয়া তথ্য থেকে হিসাব করে। ভুল তথ্য দিলে হিসাবও ভুল আসবে। আইটেমভিত্তিক লাভ একটি আনুমানিক বণ্টন, ব্যবসায়িক বা কর সংক্রান্ত সিদ্ধান্তের একমাত্র ভিত্তি নয়।</li>
 <li><b>সেবার সীমা:</b> সেবা সবসময় নির্বিঘ্ন থাকার নিশ্চয়তা দেওয়া যায় না। ইন্টারনেট বা Google/Firebase সেবার সমস্যায় সাময়িক বিঘ্ন হতে পারে। এর জন্য সরাসরি ক্ষতির দায় সীমিত।</li>
 <li><b>পরিবর্তন:</b> সুবিধা ও শর্ত সময়ে সময়ে বদলাতে পারে। বড় পরিবর্তনে অ্যাপে বা WhatsApp-এ জানানোর চেষ্টা করা হবে।</li>
</ul>`,
  privacy: `
<h2>প্রাইভেসি পলিসি</h2>
<p>আপনার তথ্যের গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ। এখানে বলা আছে কী তথ্য রাখা হয় ও কীভাবে ব্যবহার হয়।</p>
<ul>
 <li><b>কী তথ্য রাখা হয়:</b> আপনার Google অ্যাকাউন্টের ইমেইল ও নাম; আপনার দেওয়া ব্যবসার তথ্য (আইটেম, কেনা-বেচা, ব্যাচ, খরচ); প্রতিষ্ঠানের নাম ও লোগো (আপনি দিলে); ট্রায়াল ও মেয়াদের তথ্য।</li>
 <li><b>কোথায় রাখা হয়:</b> Google Firebase (Authentication ও Firestore) সেবায়। এছাড়া আপনার ফোনের ব্রাউজারেও একটি কপি থাকে, যাতে ইন্টারনেট ছাড়াও কাজ করা যায়।</li>
 <li><b>কে দেখতে পায়:</b> আপনার ব্যবসার তথ্য শুধু আপনি দেখতে পান। সেবাদাতা হিসেবে মেয়াদ ও সাবস্ক্রিপশন চালাতে আমরা আপনার ইমেইল, প্রতিষ্ঠানের নাম ও ছোট লোগো দেখতে পাই। আপনার কেনা-বেচা বা হিসাবের বিস্তারিত তথ্য আমরা দেখি না বা ঘাঁটি না, শুধু আপনি সাহায্য চাইলে আপনার অনুমতি নিয়ে সমস্যা দেখতে পারি।</li>
 <li><b>বিক্রি বা বিজ্ঞাপন:</b> আপনার তথ্য আমরা তৃতীয় পক্ষের কাছে বিক্রি করি না এবং এই অ্যাপে বিজ্ঞাপন দেখানো হয় না।</li>
 <li><b>আপনার অধিকার:</b> আপনি যেকোনো সময় টুলস থেকে আপনার লেনদেন ও আইটেম CSV হিসেবে নামাতে পারেন। আপনার ডাটা মুছে ফেলতে চাইলে ${CONTACT} নম্বরে অনুরোধ করুন, আমরা অ্যাকাউন্টের ডাটা মুছে দেব। মুছলে তা ফেরানো যাবে না।</li>
 <li><b>নিরাপত্তা:</b> প্রতিজনের ডাটা আলাদা এবং শুধু সেই লগইন করা ব্যবহারকারী পড়তে ও লিখতে পারে। তবু ইন্টারনেটে কোনো ব্যবস্থাই শতভাগ নিরাপদ নয়।</li>
 <li><b>ডিভাইসের সংরক্ষণ:</b> অ্যাপ আপনার ফোনের ব্রাউজারের স্টোরেজে ডাটার অফলাইন কপি ও ছোট সেটিংস রাখে। পাবলিক বা অন্যের ফোনে ব্যবহার করলে কাজ শেষে লগআউট করুন।</li>
</ul>`,
  refund: `
<h2>রিফান্ড নীতি</h2>
<ul>
 <li><b>ফ্রি ট্রায়াল:</b> ${TRIAL_DAYS} দিন বিনা টাকায়, তাই কোনো টাকা ফেরতের প্রশ্ন নেই। টাকা দেওয়ার আগে ভালোভাবে ব্যবহার করে দেখুন।</li>
 ${REFUND_DAYS > 0
   ? `<li><b>পেইড সাবস্ক্রিপশন:</b> পেমেন্টের মেয়াদ শুরুর ${REFUND_DAYS} দিনের মধ্যে আপনি সন্তুষ্ট না হলে ${CONTACT} নম্বরে জানালে অব্যবহৃত অংশের টাকা ফেরত দেওয়া হবে।</li>
 <li>${REFUND_DAYS} দিন পার হয়ে গেলে বা মেয়াদের অর্ধেকের বেশি ব্যবহার হয়ে গেলে টাকা ফেরত দেওয়া হয় না।</li>`
   : `<li><b>পেইড সাবস্ক্রিপশন:</b> পেমেন্ট করা টাকা সাধারণত ফেরতযোগ্য নয়। তাই পেমেন্টের আগে ট্রায়ালে ভালোভাবে দেখে নিন।</li>`}
 <li><b>অ্যাকাউন্ট বন্ধ করা হলে:</b> শর্ত ভাঙার কারণে অ্যাক্সেস বন্ধ করা হলে টাকা ফেরত নাও হতে পারে।</li>
 <li><b>ফেরতের পদ্ধতি:</b> যে মাধ্যমে (বিকাশ/নগদ ইত্যাদি) টাকা দিয়েছেন সাধারণত সেই মাধ্যমেই ফেরত দেওয়া হবে, আবেদনের ৭ কর্মদিবসের মধ্যে।</li>
</ul>`
};

document.getElementById('content').innerHTML = ['terms', 'privacy', 'refund'].map(k => `<section id="${k}">${T[k]}</section>`).join('');
document.getElementById('foot').textContent = `সর্বশেষ হালনাগাদ: ${UPDATED} • যোগাযোগ: ${CONTACT} • ${SELLER}`;
if (SHOW_DRAFT_NOTICE) {
  const d = document.getElementById('draft'); d.style.display = 'block';
  d.textContent = 'এটি একটি খসড়া। প্রকাশের আগে ফাইলের ওপরের অংশে নিজের তথ্য বসান এবং লেখাগুলো আপনার ব্যবসার নিয়ম অনুযায়ী মিলিয়ে নিন (প্রয়োজনে আইনজীবীর পরামর্শ নিন)। তারপর SHOW_DRAFT_NOTICE = false করুন।';
}
</script>
</body>
</html>
